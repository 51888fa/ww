<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工具箱">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
<link rel="apple-touch-icon" href="./assets/icon.svg">
<title>工具箱</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

:root {
  --teal-900: #134E4A;
  --teal-700: #0F766E;
  --teal-100: #CCF4E3;
  --slate-500: #64748B;
  --slate-400: #94A3B8;
  --slate-300: #CBD5E1;
  --dark: #1A1A2E;
  --gray-600: #666666;
  --gray-400: #999999;
  --green-500: #22C55E;
  --purple-500: #A855F7;
  --red-500: #EF4444;
  --white: #FFFFFF;
  --bg-toolbox: #F0FDFA;
  --bg-ad: #F5F5F5;
  --font: 'Plus Jakarta Sans', -apple-system, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font);
  width: 100vw;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: #E2E8F0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.app-container {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

/* ----- Page Container ----- */
.page {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}
.page.active { opacity: 1; pointer-events: auto; }

/* ----- Status Bar ----- */
.status-bar {
  width: 100%; height: 62px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
  font-size: 16px;
  font-weight: 600;
  color: var(--white);
  flex-shrink: 0;
}
.sb-toolbox { background: var(--teal-700); }
.sb-ad { background: var(--dark); }

.back-btn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  opacity: 0.8;
}

/* ===== PAGE 1 — Toolbox ===== */
.page-toolbox { background: var(--bg-toolbox); }
.toolbox-content {
  flex: 1; display: flex; flex-direction: column;
  padding: 20px; gap: 24px;
  overflow-y: auto;
}
.header-row { display: flex; flex-direction: column; gap: 4px; }
.header-row .title { font-size: 28px; font-weight: 800; color: var(--teal-900); letter-spacing: -0.5px; }
.header-row .subtitle { font-size: 14px; color: var(--slate-500); }
.tools-grid { display: flex; flex-direction: column; gap: 12px; flex: 1; }
.tools-row { display: flex; gap: 12px; }
.tool-card {
  flex: 1; height: 125px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px; padding: 16px;
  background: var(--white); border-radius: 12px;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  position: relative;
}
.tool-card:active { transform: scale(0.97); }
.tool-card .tool-icon { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
.tool-card .tool-icon svg { width: 44px; height: 44px; }
.tool-card span { font-size: 12px; font-weight: 600; color: var(--teal-900); text-align: center; }
.tool-card .ad-badge {
  position: absolute; top: 8px; right: 8px;
  font-size: 9px; color: #F59E0B; font-weight: 700;
  background: #FEF3C7; padding: 2px 6px; border-radius: 6px;
}
.tool-card.locked { opacity: 0.6; }
.tool-card.locked::after { content: '🔒'; position: absolute; font-size: 14px; top: 8px; right: 8px; }

/* ===== ME PAGE ===== */

/* ===== PAGE 2 — Ad Monitor ===== */
.page-ad { background: var(--bg-ad); }
.ad-content {
  flex: 1; display: flex; flex-direction: column;
  padding: 20px; gap: 20px; overflow-y: auto;
}
/* ===== DATA CARDS ===== */
.source-label {
  text-align: center; font-size: 11px;
  color: var(--gray-400); padding-bottom: 4px;
}

.data-cards { display: flex; flex-direction: column; gap: 12px; }
.data-card { padding: 14px 16px; background: var(--white); border-radius: 14px; display: flex; flex-direction: column; gap: 6px; }
.data-card-row { display: flex; align-items: center; gap: 10px; }
.data-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.data-info { flex: 1; }
.data-line {
  display: flex; justify-content: space-between;
  align-items: center; padding: 3px 0;
  font-size: 13px; color: var(--dark);
}
.data-line .badge { font-weight: 700; font-size: 13px; }

/* ===== TOOL PAGES: Calculator ===== */
.page-calc { background: var(--bg-toolbox); }
.calc-display {
  margin: 0 20px;
  background: var(--white); border-radius: 16px;
  padding: 20px; min-height: 80px;
  display: flex; flex-direction: column;
  align-items: flex-end; justify-content: flex-end;
}
.calc-expr { font-size: 16px; color: var(--gray-400); min-height: 24px; word-break: break-all; text-align: right; }
.calc-result { font-size: 40px; font-weight: 800; color: var(--teal-900); }
.calc-pad {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 8px; padding: 20px; flex: 1;
}
.calc-btn {
  height: 64px; border-radius: 16px; border: none;
  font-size: 22px; font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  transition: transform 0.1s;
}
.calc-btn:active { transform: scale(0.95); }
.calc-btn-num { background: var(--white); color: var(--teal-900); }
.calc-btn-op { background: var(--teal-100); color: var(--teal-700); }
.calc-btn-eq { background: var(--teal-700); color: #fff; }
.calc-btn-fn { background: #E2E8F0; color: var(--slate-500); font-size: 16px; }

/* ===== TOOL PAGES: Timer ===== */
.page-timer { background: var(--bg-toolbox); }
.timer-display {
  margin: 0 20px; padding: 30px 20px;
  background: var(--white); border-radius: 16px;
  text-align: center;
}
.timer-clock { font-size: 56px; font-weight: 800; color: var(--teal-900); font-variant-numeric: tabular-nums; letter-spacing: 2px; }
.timer-status { font-size: 14px; color: var(--slate-500); margin-top: 8px; }
.timer-presets {
  display: flex; gap: 8px; padding: 0 20px; flex-wrap: wrap;
}
.preset-btn {
  flex: 1; min-width: 60px; height: 44px;
  border-radius: 12px; border: 1.5px solid var(--slate-300);
  background: var(--white); font-size: 14px; font-weight: 600;
  color: var(--teal-900); cursor: pointer;
  font-family: var(--font);
  transition: all 0.15s;
}
.preset-btn.active { border-color: var(--teal-700); background: var(--teal-100); }
.timer-actions {
  display: flex; gap: 12px; padding: 20px;
}
.timer-btn {
  flex: 1; height: 56px; border-radius: 16px;
  border: none; font-size: 18px; font-weight: 700;
  font-family: var(--font); cursor: pointer;
  transition: transform 0.1s;
}
.timer-btn:active { transform: scale(0.97); }
.timer-btn-start { background: var(--teal-700); color: #fff; }
.timer-btn-pause { background: #FEF3C7; color: #D97706; }
.timer-btn-reset { background: #FEE2E2; color: #DC2626; }

/* ===== TOOL PAGES: Converter ===== */
.page-convert { background: var(--bg-toolbox); }
.convert-content { padding: 0 20px; display: flex; flex-direction: column; gap: 16px; flex: 1; }
.convert-tabs {
  display: flex; gap: 4px; background: var(--white);
  border-radius: 12px; padding: 4px;
}
.convert-tab {
  flex: 1; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 10px; font-size: 13px; font-weight: 600;
  color: var(--slate-500); cursor: pointer;
  font-family: var(--font); border: none; background: transparent;
}
.convert-tab.active { background: var(--teal-700); color: #fff; }
.convert-card {
  background: var(--white); border-radius: 16px;
  padding: 20px; display: flex; flex-direction: column; gap: 12px;
}
.convert-input {
  width: 100%; height: 56px; border-radius: 12px;
  border: 1.5px solid var(--slate-300); padding: 0 16px;
  font-size: 24px; font-weight: 700; color: var(--teal-900);
  font-family: var(--font); text-align: right;
  outline: none;
}
.convert-input:focus { border-color: var(--teal-700); }
.convert-selectors { display: flex; align-items: center; gap: 8px; }
.convert-select {
  flex: 1; height: 44px; border-radius: 10px;
  border: 1.5px solid var(--slate-300);
  padding: 0 12px; font-size: 14px; font-weight: 600;
  color: var(--dark); font-family: var(--font);
  background: var(--white); cursor: pointer;
}
.convert-swap {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; background: var(--teal-100);
  cursor: pointer; font-size: 18px;
  flex-shrink: 0;
}
.convert-result {
  text-align: center; padding: 12px;
  font-size: 32px; font-weight: 800; color: var(--teal-700);
  background: var(--teal-100); border-radius: 12px;
}
.convert-detail {
  text-align: center; font-size: 12px; color: var(--gray-400);
}

/* ===== Bottom Pill Bar ===== */
.bottom-bar {
  padding: 12px 21px 21px 21px;
  flex-shrink: 0;
}
.pill-bar {
  display: flex;
  height: 62px; padding: 4px;
  background: var(--white); border-radius: 36px;
  border: 1px solid var(--teal-100);
}
.tab {
  flex: 1; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 2px;
  border-radius: 26px;
  cursor: pointer;
  transition: background 0.2s;
}
.tab img { width: 18px; height: 18px; }
.tab span { font-size: 10px; font-weight: 500; letter-spacing: 0.5px; }
.tab.active { background: var(--teal-700); }
.tab.active span { color: var(--white); font-weight: 600; }
.tab.tab-ad-active { background: var(--dark); }
.tab.tab-ad-active span { color: var(--white); font-weight: 600; }
.tab:not(.active):not(.tab-ad-active):not(.tab-me-active) span { color: var(--slate-500); }
.tab-me-active { background: var(--teal-700); }
.tab-me-active span { color: var(--white); font-weight: 600; }

/* ===== PAGE: My / Profile ===== */
.page-me { background: var(--bg-toolbox); }
.me-content { flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 20px; overflow-y: auto; }

.me-card {
  background: var(--white); border-radius: 16px;
  padding: 24px; display: flex; flex-direction: column;
  align-items: center; gap: 10px;
}
.me-avatar {
  width: 72px; height: 72px; border-radius: 50%;
  background: linear-gradient(135deg, var(--teal-700), #2DD4BF);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; font-weight: 800; color: #fff;
}
.me-name { font-size: 20px; font-weight: 700; color: var(--teal-900); }
.me-id { font-size: 12px; color: var(--gray-400); }

.me-stats {
  display: flex; gap: 0;
  background: var(--white); border-radius: 16px;
  overflow: hidden;
}
.me-stat {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; gap: 4px; padding: 16px 8px;
  position: relative;
}
.me-stat:not(:last-child)::after {
  content: ''; position: absolute; right: 0; top: 20%;
  width: 1px; height: 60%;
  background: var(--slate-300);
}
.me-stat-val { font-size: 22px; font-weight: 800; color: var(--teal-700); }
.me-stat-label { font-size: 11px; color: var(--gray-400); }

.me-menu {
  background: var(--white); border-radius: 16px;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.me-menu-item {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 20px; cursor: pointer;
  transition: background 0.15s;
}
.me-menu-item:active { background: var(--bg-toolbox); }
.me-menu-item:not(:last-child) { border-bottom: 1px solid var(--teal-100); }
.me-menu-icon { font-size: 20px; width: 28px; text-align: center; }
.me-menu-text { flex: 1; font-size: 15px; font-weight: 600; color: var(--teal-900); }
.me-menu-arrow { color: var(--slate-400); font-size: 14px; }
.me-menu-item.danger .me-menu-text { color: var(--red-500); }

/* ===== LOGIN / REGISTER ===== */
.page-login {
  background: linear-gradient(160deg, #0F766E 0%, #134E4A 100%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 28px; gap: 24px;
}
.login-logo {
  width: 72px; height: 72px;
  background: rgba(255,255,255,0.15);
  border-radius: 22px;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px;
}
.login-title {
  font-size: 26px; font-weight: 800; color: #fff;
  letter-spacing: -0.5px; text-align: center;
}
.login-subtitle {
  font-size: 14px; color: rgba(255,255,255,0.7);
  text-align: center; margin-top: -16px;
}
.login-form {
  width: 100%; display: flex; flex-direction: column; gap: 14px;
  margin-top: 8px;
}
.login-input-group {
  display: flex; flex-direction: column; gap: 6px;
}
.login-input-group label {
  font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.85);
  padding-left: 4px;
}
.login-input {
  width: 100%; height: 52px;
  border-radius: 14px; border: 1.5px solid rgba(255,255,255,0.2);
  background: rgba(255,255,255,0.1);
  padding: 0 16px; font-size: 17px; font-weight: 600;
  color: #fff; font-family: var(--font);
  outline: none; transition: border 0.2s, background 0.2s;
}
.login-input::placeholder { color: rgba(255,255,255,0.35); }
.login-input:focus {
  border-color: rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.15);
}
.login-input.pin {
  letter-spacing: 12px; text-align: center; font-size: 22px;
}
.login-btn {
  width: 100%; height: 52px;
  border-radius: 14px; border: none;
  background: #fff; color: var(--teal-700);
  font-size: 17px; font-weight: 700;
  font-family: var(--font); cursor: pointer;
  transition: transform 0.15s, opacity 0.2s;
  margin-top: 6px;
}
.login-btn:active { transform: scale(0.97); }
.login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.login-switch {
  font-size: 13px; color: rgba(255,255,255,0.6);
  text-align: center; cursor: pointer;
  margin-top: -8px;
}
.login-switch u { color: rgba(255,255,255,0.9); }
.login-error {
  font-size: 12px; color: #FCA5A5; text-align: center;
  min-height: 18px; margin-top: -6px;
}
.login-skip {
  font-size: 12px; color: rgba(255,255,255,0.4);
  text-align: center; cursor: pointer; margin-top: 8px;
}
</style>
</head>
<body>

<div class="app-container">

  <!-- ========== LOGIN PAGE ========== -->
  <div class="page page-login active" id="page-login">
    <div class="login-logo">🔐</div>
    <div class="login-title" id="loginTitle">欢迎回来</div>
    <div class="login-subtitle" id="loginSub">登录即可使用全部工具</div>
    <div class="login-form">
      <div class="login-input-group">
        <label>名字</label>
        <input type="text" class="login-input" id="loginName" placeholder="输入你的名字" maxlength="20" autocomplete="off">
      </div>
      <div class="login-input-group">
        <label>4位密码</label>
        <input type="password" class="login-input pin" id="loginPin" placeholder="····" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
      </div>
      <div class="login-input-group" id="pinConfirmGroup" style="display:none">
        <label>确认密码</label>
        <input type="password" class="login-input pin" id="loginPinConfirm" placeholder="····" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
      </div>
      <div class="login-error" id="loginError"></div>
      <button class="login-btn" id="loginBtn" onclick="handleAuth()" disabled>登录</button>
    </div>
    <div class="login-switch" id="loginSwitch" onclick="toggleAuthMode()">没有账号？<u>立即注册</u></div>
    <div class="login-skip" onclick="skipLogin()">跳过登录，直接进入</div>
  </div>

  <!-- ========== PAGE 1: Toolbox ========== -->
  <div class="page page-toolbox" id="page-toolbox">
    <div class="status-bar sb-toolbox">9:41</div>
    <div class="toolbox-content">
      <div class="header-row">
        <span class="title">工具箱</span>
        <span class="subtitle">实用工具，触手可及</span>
      </div>
      <div class="tools-grid">
        <div class="tools-row">
          <div class="tool-card" onclick="openTool('calculator')">
            <div class="tool-icon"><svg viewBox="0 0 48 48"><rect x="5" y="2" width="38" height="44" rx="8" fill="#0F766E"/><rect x="9" y="6" width="30" height="12" rx="4" fill="rgba(255,255,255,0.2)"/><text x="24" y="15" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-family="sans-serif" font-size="9" font-weight="700">123</text><rect x="9" y="22" width="10" height="7" rx="3" fill="rgba(255,255,255,0.85)"/><rect x="21" y="22" width="10" height="7" rx="3" fill="rgba(255,255,255,0.85)"/><rect x="33" y="22" width="10" height="7" rx="3" fill="#2DD4BF"/><rect x="9" y="31" width="10" height="7" rx="3" fill="rgba(255,255,255,0.85)"/><rect x="21" y="31" width="10" height="7" rx="3" fill="rgba(255,255,255,0.85)"/><rect x="33" y="31" width="10" height="7" rx="3" fill="#2DD4BF"/><rect x="9" y="40" width="10" height="7" rx="3" fill="rgba(255,255,255,0.85)"/><rect x="21" y="40" width="22" height="7" rx="3" fill="rgba(255,255,255,0.85)"/></svg></div>
            <span>计算器</span>
          </div>
          <div class="tool-card" onclick="openTool('timer')">
            <div class="tool-icon"><svg viewBox="0 0 48 48"><circle cx="24" cy="26" r="18" fill="none" stroke="#F59E0B" stroke-width="3.5"/><circle cx="24" cy="26" r="16" fill="#FFF8E1"/><circle cx="24" cy="26" r="3.5" fill="#F59E0B"/><line x1="24" y1="26" x2="24" y2="14" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/><line x1="24" y1="26" x2="32" y2="26" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/><circle cx="24" cy="7" r="2.5" fill="#F59E0B"/><rect x="21.5" y="4" width="5" height="4" rx="2" fill="#F59E0B"/><circle cx="14" cy="42" r="1.5" fill="#FCD34D"/><circle cx="24" cy="44" r="1.5" fill="#FCD34D"/><circle cx="34" cy="42" r="1.5" fill="#FCD34D"/></svg></div>
            <span>计时器</span>
          </div>
        </div>
        <div class="tools-row">
          <div class="tool-card" onclick="openTool('converter')">
            <div class="tool-icon"><svg viewBox="0 0 48 48"><rect x="4" y="8" width="17" height="15" rx="5" fill="#8B5CF6"/><text x="12.5" y="19" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="700">m</text><rect x="27" y="25" width="17" height="15" rx="5" fill="#A78BFA"/><text x="35.5" y="36" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="11" font-weight="700">ft</text><path d="M21 16 L26 16 L21 32 L26 32" stroke="#7C3AED" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><polygon points="24,12 27,17 21,17" fill="#8B5CF6"/><polygon points="24,36 27,31 21,31" fill="#A78BFA"/></svg></div>
            <span>单位换算</span>
          </div>
          <div class="tool-card" onclick="alert('该工具暂未开放')">
            <div class="tool-icon"><svg viewBox="0 0 48 48"><rect x="7" y="6" width="34" height="36" rx="4" fill="#EAB308"/><polygon points="41,6 34,6 41,13" fill="#CA8A04"/><polygon points="41,6 41,14 34,14" fill="none"/><line x1="14" y1="18" x2="28" y2="18" stroke="rgba(0,0,0,0.15)" stroke-width="2" stroke-linecap="round"/><line x1="14" y1="24" x2="32" y2="24" stroke="rgba(0,0,0,0.15)" stroke-width="2" stroke-linecap="round"/><line x1="14" y1="30" x2="24" y2="30" stroke="rgba(0,0,0,0.15)" stroke-width="2" stroke-linecap="round"/><line x1="10" y1="36" x2="22" y2="36" stroke="#FEF08A" stroke-width="6" stroke-linecap="round"/></svg></div>
            <span>便签</span>
          </div>
        </div>

<script>
// ======== AUTH ========
let authMode = 'login'; // 'login' or 'register'
let currentUser = null;

function initAuth() {
  const saved = localStorage.getItem('toolbox_user');
  if (saved) {
    currentUser = JSON.parse(saved);
    document.getElementById('page-login').classList.remove('active');
    showPage('page-toolbox');
    showUserGreeting();
  }
  setupAuthInputs();
}

function setupAuthInputs() {
  const nameEl = document.getElementById('loginName');
  const pinEl = document.getElementById('loginPin');
  const pinConfirmEl = document.getElementById('loginPinConfirm');
  const btnEl = document.getElementById('loginBtn');

  function validate() {
    const name = nameEl.value.trim();
    const pin = pinEl.value;
    let valid = name.length > 0 && pin.length === 4 && /^\d{4}$/.test(pin);
    if (authMode === 'register') {
      const pin2 = pinConfirmEl ? pinConfirmEl.value : '';
      valid = valid && pin2.length === 4 && pin === pin2;
    }
    btnEl.disabled = !valid;
  }

  nameEl.addEventListener('input', validate);
  pinEl.addEventListener('input', function() {
    this.value = this.value.replace(/\D/g, '').slice(0, 4);
    validate();
  });
  if (pinConfirmEl) {
    pinConfirmEl.addEventListener('input', function() {
      this.value = this.value.replace(/\D/g, '').slice(0, 4);
      validate();
    });
  }
}

function toggleAuthMode() {
  const title = document.getElementById('loginTitle');
  const sub = document.getElementById('loginSub');
  const btn = document.getElementById('loginBtn');
  const sw = document.getElementById('loginSwitch');
  const confirmGroup = document.getElementById('pinConfirmGroup');
  const pinConfirm = document.getElementById('loginPinConfirm');

  if (authMode === 'login') {
    authMode = 'register';
    title.textContent = '创建账号';
    sub.textContent = '设置名字和4位密码';
    btn.textContent = '注册';
    sw.innerHTML = '已有账号？<u>立即登录</u>';
    confirmGroup.style.display = 'flex';
  } else {
    authMode = 'login';
    title.textContent = '欢迎回来';
    sub.textContent = '登录即可使用全部工具';
    btn.textContent = '登录';
    sw.innerHTML = '没有账号？<u>立即注册</u>';
    confirmGroup.style.display = 'none';
  }
  document.getElementById('loginError').textContent = '';
  document.getElementById('loginPin').value = '';
  if (pinConfirm) pinConfirm.value = '';
  document.getElementById('loginBtn').disabled = true;
}

function handleAuth() {
  const name = document.getElementById('loginName').value.trim();
  const pin = document.getElementById('loginPin').value;
  const errorEl = document.getElementById('loginError');

  if (authMode === 'login') {
    const saved = localStorage.getItem('toolbox_user');
    if (!saved) {
      errorEl.textContent = '账号不存在，请先注册';
      return;
    }
    const user = JSON.parse(saved);
    if (user.name !== name || user.pin !== pin) {
      errorEl.textContent = '名字或密码错误';
      return;
    }
    currentUser = user;
    enterApp();
  } else {
    const pinConfirm = document.getElementById('loginPinConfirm').value;
    if (pin !== pinConfirm) {
      errorEl.textContent = '两次密码不一致';
      return;
    }
    const existing = localStorage.getItem('toolbox_user');
    if (existing && JSON.parse(existing).name === name) {
      errorEl.textContent = '该名字已被使用';
      return;
    }
    const user = { name, pin, createdAt: new Date().toISOString() };
    localStorage.setItem('toolbox_user', JSON.stringify(user));
    currentUser = user;
    enterApp();
  }
}

function enterApp() {
  document.getElementById('page-login').classList.remove('active');
  showPage('page-toolbox');
  showUserGreeting();
}

function showUserGreeting() {
  if (!currentUser) return;
  const headers = document.querySelectorAll('.header-row .subtitle');
  headers.forEach(h => {
    if (h.closest('.page-toolbox')) {
      h.textContent = '你好，' + currentUser.name;
    }
  });
}

function skipLogin() {
  document.getElementById('page-login').classList.remove('active');
  showPage('page-toolbox');
}

// ======== OPEN TOOL (direct, no ad) ========
function openTool(tool) {
  trackToolUse();
  if (tool === 'calculator') {
    showPage('page-calc');
  } else if (tool === 'timer') {
    showPage('page-timer');
  } else if (tool === 'converter') {
    showPage('page-convert');
  }
}

// ======== PAGE NAVIGATION ========
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function backToToolbox() {
  showPage('page-toolbox');
}

function switchTab(tab) {
  // Update tab active states in bottom bars
  document.querySelectorAll('.pill-bar .tab').forEach(t => {
    t.classList.remove('active', 'tab-ad-active', 'tab-me-active');
    if (tab === 'toolbox' && t.onclick && t.onclick.toString().includes("'toolbox'")) t.classList.add('active');
    if (tab === 'ad' && t.onclick && t.onclick.toString().includes("'ad'")) { t.classList.add('tab-ad-active'); t.style.background = 'var(--dark)'; t.style.borderRadius = '26px'; }
    if (tab === 'me' && t.onclick && t.onclick.toString().includes("'me'")) t.classList.add('tab-me-active');
  });

  if (tab === 'toolbox') showPage('page-toolbox');
  else if (tab === 'ad') showPage('page-ad');
  else if (tab === 'me') { refreshMePage(); showPage('page-me'); }
}

// ======== CALCULATOR ========
let calcExpr = '';
let calcCurrent = '0';
let calcShouldReset = true;

function calcInput(key) {
  if (key === 'C') {
    calcExpr = ''; calcCurrent = '0'; calcShouldReset = true;
  } else if (key === '⌫') {
    if (calcShouldReset) { calcCurrent = '0'; }
    else {
      calcCurrent = calcCurrent.slice(0, -1) || '0';
    }
  } else if (key === '=') {
    try {
      let expr = calcExpr + calcCurrent;
      expr = expr.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
      let result = eval(expr);
      result = parseFloat(result.toFixed(10));
      calcCurrent = String(result);
      calcExpr = '';
      calcShouldReset = true;
    } catch(e) {
      calcCurrent = 'Error'; calcShouldReset = true;
    }
  } else if (['+','-','*','/','%'].includes(key)) {
    if (calcCurrent === 'Error') { calcCurrent = '0'; }
    calcExpr += calcCurrent + ' ' + key + ' ';
    calcShouldReset = true;
  } else {
    if (calcShouldReset) { calcCurrent = ''; calcShouldReset = false; }
    if (key === '.' && calcCurrent.includes('.')) return;
    calcCurrent += key;
  }
  updateCalcDisplay();
}

function updateCalcDisplay() {
  document.getElementById('calcExpr').textContent = calcExpr;
  document.getElementById('calcResult').textContent = calcShouldReset && calcCurrent !== 'Error' ? calcCurrent : (calcCurrent || '0');
}

// ======== TIMER ========
let timerSeconds = 60;
let timerRunning = false;
let timerInterval = null;
let timerRemaining = 60;

function setTimerPreset(secs) {
  if (timerRunning) return;
  timerSeconds = secs;
  timerRemaining = secs;
  updateTimerDisplay();
  document.querySelectorAll('#timerPresets .preset-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

function toggleTimer() {
  if (timerRunning) {
    pauseTimer();
  } else {
    startTimer();
  }
}

function startTimer() {
  if (timerRemaining <= 0) timerRemaining = timerSeconds;
  timerRunning = true;
  document.getElementById('timerStatus').textContent = '计时中…';
  document.getElementById('timerStartBtn').textContent = '暂停';
  document.getElementById('timerStartBtn').className = 'timer-btn timer-btn-pause';
  timerInterval = setInterval(() => {
    timerRemaining--;
    updateTimerDisplay();
    if (timerRemaining <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      timerRunning = false;
      document.getElementById('timerStatus').textContent = '⏰ 时间到！';
      document.getElementById('timerStartBtn').textContent = '开始';
      document.getElementById('timerStartBtn').className = 'timer-btn timer-btn-start';
      // vibrate if available
      if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
    }
  }, 1000);
}

function pauseTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  timerRunning = false;
  document.getElementById('timerStatus').textContent = '已暂停';
  document.getElementById('timerStartBtn').textContent = '继续';
  document.getElementById('timerStartBtn').className = 'timer-btn timer-btn-start';
}

function resetTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  timerRunning = false;
  timerRemaining = timerSeconds;
  document.getElementById('timerStatus').textContent = '设置时间开始计时';
  document.getElementById('timerStartBtn').textContent = '开始';
  document.getElementById('timerStartBtn').className = 'timer-btn timer-btn-start';
  updateTimerDisplay();
}

function updateTimerDisplay() {
  const m = Math.floor(timerRemaining / 60);
  const s = timerRemaining % 60;
  document.getElementById('timerClock').textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

// ======== CONVERTER ========
const units = {
  length: [
    { name: '米 (m)', factor: 1 },
    { name: '千米 (km)', factor: 1000 },
    { name: '厘米 (cm)', factor: 0.01 },
    { name: '毫米 (mm)', factor: 0.001 },
    { name: '英尺 (ft)', factor: 0.3048 },
    { name: '英寸 (in)', factor: 0.0254 },
    { name: '码 (yd)', factor: 0.9144 },
    { name: '英里 (mi)', factor: 1609.344 }
  ],
  weight: [
    { name: '千克 (kg)', factor: 1 },
    { name: '克 (g)', factor: 0.001 },
    { name: '毫克 (mg)', factor: 0.000001 },
    { name: '吨 (t)', factor: 1000 },
    { name: '磅 (lb)', factor: 0.453592 },
    { name: '盎司 (oz)', factor: 0.0283495 }
  ],
  temp: [
    { name: '摄氏度 (°C)', key: 'c' },
    { name: '华氏度 (°F)', key: 'f' },
    { name: '开尔文 (K)', key: 'k' }
  ]
};
let convertType = 'length';

function setConvertType(type, btn) {
  convertType = type;
  document.querySelectorAll('#convertTabs .convert-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  populateUnits();
  doConvert();
}

function populateUnits() {
  const list = units[convertType];
  const from = document.getElementById('convertUnitFrom');
  const to = document.getElementById('convertUnitTo');
  from.innerHTML = '';
  to.innerHTML = '';
  list.forEach((u, i) => {
    let label = convertType === 'temp' ? u.name : u.name.split(' ')[0];
    from.innerHTML += '<option value="' + i + '">' + u.name + '</option>';
    to.innerHTML += '<option value="' + i + '"' + (i === 1 ? ' selected' : '') + '>' + u.name + '</option>';
  });
  from.value = 0;
  to.value = Math.min(1, list.length - 1);
}

function swapUnits() {
  const from = document.getElementById('convertUnitFrom');
  const to = document.getElementById('convertUnitTo');
  [from.value, to.value] = [to.value, from.value];
  doConvert();
}

function doConvert() {
  const val = parseFloat(document.getElementById('convertFrom').value);
  if (isNaN(val)) {
    document.getElementById('convertResult').textContent = '--';
    document.getElementById('convertDetail').textContent = '';
    return;
  }
  const list = units[convertType];
  const fi = parseInt(document.getElementById('convertUnitFrom').value);
  const ti = parseInt(document.getElementById('convertUnitTo').value);
  let result;

  if (convertType === 'temp') {
    // From source to Celsius
    let celsius;
    const fk = list[fi].key;
    if (fk === 'c') celsius = val;
    else if (fk === 'f') celsius = (val - 32) * 5 / 9;
    else if (fk === 'k') celsius = val - 273.15;
    // From Celsius to target
    const tk = list[ti].key;
    if (tk === 'c') result = celsius;
    else if (tk === 'f') result = celsius * 9 / 5 + 32;
    else if (tk === 'k') result = celsius + 273.15;
  } else {
    const inMeters = val * list[fi].factor;
    result = inMeters / list[ti].factor;
  }

  const formatted = parseFloat(result.toFixed(6));
  document.getElementById('convertResult').textContent = formatted + ' ' + (convertType === 'temp' ? list[ti].name.split(' ')[0] : list[ti].name.split(' ')[0]);
  document.getElementById('convertDetail').textContent = '1 ' + list[fi].name + ' = ' + (result/val).toFixed(6) + ' ' + list[ti].name;
}

function renderDataCards() {
  const container = document.getElementById('dataCards');
  container.innerHTML = adData.map(item => {
    let html = '<div class="data-card">';
    item.rows.forEach(row => {
      html += '<div class="data-card-row">';
      html += '<div class="data-dot" style="background:' + item.color + '"></div>';
      html += '<div class="data-info">';
      html += '<div class="data-line">';
      if (row.today) {
        html += '<span>' + row.time + '</span>';
        html += '<span class="badge" style="color:' + item.color + '">' + row.today + '</span>';
      } else {
        html += '<span>' + row.time + ' ' + row.val + '</span>';
      }
      html += '</div></div></div>';
    });
    html += '</div>';
    return html;
  }).join('');
}

// ======== PROFILE / MY PAGE ========
function refreshMePage() {
  const avatar = document.getElementById('meAvatar');
  const name = document.getElementById('meName');
  const joinDate = document.getElementById('meJoinDate');

  if (currentUser) {
    avatar.textContent = currentUser.name.charAt(0).toUpperCase();
    name.textContent = currentUser.name;
    const created = currentUser.createdAt ? new Date(currentUser.createdAt) : new Date();
    joinDate.textContent = '注册于 ' + created.toLocaleDateString('zh-CN');

    // Stats
    const toolCount = parseInt(localStorage.getItem('toolbox_tool_uses') || '0');
    document.getElementById('meToolCount').textContent = toolCount;

    if (currentUser.createdAt) {
      const days = Math.max(1, Math.floor((Date.now() - new Date(currentUser.createdAt).getTime()) / 86400000) + 1);
      document.getElementById('meLoginDays').textContent = days;
    }
  } else {
    avatar.textContent = '?';
    name.textContent = '未登录';
    joinDate.textContent = '';
    document.getElementById('meToolCount').textContent = '0';
    document.getElementById('meLoginDays').textContent = '0';
  }
}

function trackToolUse() {
  const count = parseInt(localStorage.getItem('toolbox_tool_uses') || '0');
  localStorage.setItem('toolbox_tool_uses', count + 1);
}

function changePin() {
  if (!currentUser) { alert('请先登录'); return; }
  const newPin = prompt('请输入新的4位数字密码');
  if (!newPin || !/^\d{4}$/.test(newPin)) { alert('密码必须是4位数字'); return; }
  currentUser.pin = newPin;
  localStorage.setItem('toolbox_user', JSON.stringify(currentUser));
  alert('密码修改成功！');
}

function showAbout() {
  alert('工具箱 v1.0\n\n实用工具合集\n计算器 · 计时器 · 单位换算');
}

function logout() {
  if (!currentUser) { alert('当前未登录'); showPage('page-login'); return; }
  if (confirm('确定退出登录吗？')) {
    localStorage.removeItem('toolbox_user');
    currentUser = null;
    document.getElementById('page-login').classList.add('active');
    document.querySelectorAll('.header-row .subtitle').forEach(h => {
      if (h.closest('.page-toolbox')) h.textContent = '实用工具，触手可及';
    });
    showPage('page-toolbox');
    alert('已退出登录');
  }
}
